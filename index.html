<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>AIR RADAR PRO v17.5</title>
    <style>
        :root { --radar-green: #00ff41; --alert-red: #ff0000; --bg-dark: #0a0a0a; }
        body { background: var(--bg-dark); color: var(--radar-green); font-family: 'Consolas', monospace; margin: 0; overflow: hidden; }
        
        /* طبقة الخريطة (التي تظهر في صورتك الأصلية) */
        #radar-screen { 
            position: relative; width: 100vw; height: 100vh; 
            background-image: url('https://i.imgur.com/uR8Qv3y.png'); /* خريطة افتراضية للجزائر تشبه صورتك */
            background-size: cover; background-position: center;
        }

        /* دوائر المدى الجغرافي */
        .range-circle {
            position: absolute; border: 1px solid rgba(0, 255, 65, 0.4); border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .c100 { width: 400px; height: 400px; } 
        .c150 { width: 600px; height: 600px; }

        /* الطائرات (التي كانت تظهر في v16.0) */
        .aircraft {
            position: absolute; width: 12px; height: 12px;
            background: #f0f; border-radius: 2px; transform: rotate(45deg);
            box-shadow: 0 0 10px #f0f; transition: 0.5s;
        }

        /* حالة التنبيه */
        .alert-active { animation: emergency-blink 0.4s infinite alternate; }
        @keyframes emergency-blink { from { background: rgba(0,0,0,1); } to { background: rgba(50, 0, 0, 1); } }

        #status-bar { position: fixed; bottom: 20px; left: 20px; padding: 15px; border: 1px solid var(--radar-green); background: rgba(0,0,0,0.8); }
    </style>
</head>
<body id="main-ui">

    <div id="radar-screen">
        <div class="range-circle c100"></div>
        <div class="range-circle c150"></div>
        <div style="position: absolute; top:50%; left:50%; width:8px; height:8px; background:#fff; border-radius:50%; transform: translate(-50%, -50%);"></div>
        
        <div id="targets-container"></div>
    </div>

    <div id="status-bar">
        [ SYSTEM: AIR RADAR PRO v17.5 ]<br>
        <span id="alert-msg">STATUS: MONITORING SECTOR...</span>
    </div>

    <script>
        // إحداثيات مركز الرادار (Biskra)
        const CENTER_X = window.innerWidth / 2;
        const CENTER_Y = window.innerHeight / 2;
        const ALERT_THRESHOLD = 200; // المسافة بـ البكسل (تعادل 100nm في رسمك)

        // بيانات الطائرات (نفس أسلوب v16.0 المحلي)
        let aircraftData = [
            { id: "AH6192", x: 100, y: 150 },
            { id: "AF445", x: 400, y: 300 },
            { id: "INTRUDER", x: CENTER_X + 50, y: CENTER_Y + 50 } // طائرة قريبة جداً
        ];

        function updateRadar() {
            const container = document.getElementById('targets-container');
            container.innerHTML = "";
            let intrusionDetected = false;

            aircraftData.forEach(ac => {
                // رسم الطائرة
                let div = document.createElement('div');
                div.className = 'aircraft';
                div.style.left = ac.x + 'px';
                div.style.top = ac.y + 'px';
                container.appendChild(div);

                // حساب المسافة محلياً (بدون API)
                let dist = Math.sqrt(Math.pow(ac.x - CENTER_X, 2) + Math.pow(ac.y - CENTER_Y, 2));

                if (dist < ALERT_THRESHOLD) {
                    intrusionDetected = true;
                }
            });

            if (intrusionDetected) {
                triggerAlert();
            } else {
                clearAlert();
            }
        }

        function triggerAlert() {
            document.getElementById('main-ui').classList.add('alert-active');
            document.getElementById('alert-msg').innerHTML = "<span style='color:red'>⚠️ WARNING: TARGET IN PROXIMITY</span>";
        }

        function clearAlert() {
            document.getElementById('main-ui').classList.remove('alert-active');
            document.getElementById('alert-msg').innerText = "STATUS: MONITORING SECTOR...";
        }

        // تحديث الرادار كل ثانية
        setInterval(updateRadar, 1000);
    </script>
</body>
</html>

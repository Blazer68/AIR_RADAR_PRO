<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>AIR RADAR PRO v18.0</title>
    <style>
        :root { --radar-green: #00ff41; --alert-red: #ff0000; --bg-dark: #060606; }
        body { background: var(--bg-dark); color: var(--radar-green); font-family: 'Consolas', monospace; margin: 0; overflow: hidden; }
        
        /* رسم الخريطة الجغرافية برمجياً لضمان عدم اختفائها */
        #radar-canvas { width: 100vw; height: 100vh; display: block; background: radial-gradient(circle, #0a1a0a 0%, #000 70%); }

        /* لوحة البيانات الاحترافية */
        #data-panel { position: fixed; bottom: 20px; left: 20px; border: 1px solid var(--radar-green); background: rgba(0,0,0,0.9); padding: 15px; z-index: 100; min-width: 250px; }
        .alert-ui { animation: blink-red 0.5s infinite alternate; }
        @keyframes blink-red { from { border-color: var(--radar-green); } to { border-color: var(--alert-red); box-shadow: 0 0 15px var(--alert-red); } }
    </style>
</head>
<body>

    <canvas id="radar-canvas"></canvas>

    <div id="data-panel">
        <div>[ SYSTEM: MONITORING ]</div>
        <div id="status-text">SCANNING SECTOR 05...</div>
        <hr border="0" style="border-top: 1px dashed #333">
        <div id="target-info">NO THREATS DETECTED</div>
    </div>

    <script>
        const canvas = document.getElementById('radar-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const HOME = { x: width/2, y: height/2 };
        const ALERT_ZONE = 180; // بكسل (تقريباً 100nm)

        // بيانات الطائرات المحلية (كما في v16.0)
        let targets = [
            { id: "DZ-110", x: 200, y: 200, color: "#f0f" },
            { id: "AIR-BI-05", x: width/2 + 60, y: height/2 + 60, color: "#f0f" } // هدف داخل المحيط
        ];

        function drawRadar() {
            ctx.clearRect(0, 0, width, height);

            // 1. رسم دوائر المدى (100nm - 150nm) كما في صورتك الأصلية
            ctx.strokeStyle = "rgba(0, 255, 65, 0.3)";
            ctx.setLineDash([5, 5]);
            [100, 180, 260].forEach(r => {
                ctx.beginPath();
                ctx.arc(HOME.x, HOME.y, r, 0, Math.PI * 2);
                ctx.stroke();
            });

            // 2. رسم الطائرات والتحقق من التنبيه
            let alert = false;
            ctx.setLineDash([]);
            targets.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.fillRect(t.x, t.y, 8, 8); // رسم الطائرة كمربع صغير
                ctx.fillText(t.id, t.x + 10, t.y);

                // حساب المسافة فيزيائياً
                let dist = Math.sqrt(Math.pow(t.x - HOME.x, 2) + Math.pow(t.y - HOME.y, 2));
                if(dist < ALERT_ZONE) alert = true;
            });

            // 3. تحديث واجهة التنبيه
            const panel = document.getElementById('data-panel');
            if(alert) {
                panel.classList.add('alert-ui');
                document.getElementById('status-text').innerHTML = "<span style='color:red'>⚠️ TARGET IN PROXIMITY</span>";
                document.body.style.backgroundColor = "#120000"; // تعتيم أحمر خفيف
            } else {
                panel.classList.remove('alert-ui');
                document.getElementById('status-text').innerText = "SCANNING SECTOR 05...";
                document.body.style.backgroundColor = "#060606";
            }

            requestAnimationFrame(drawRadar);
        }

        drawRadar();
    </script>
</body>
</html>

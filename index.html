<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIR RADAR v16.0 | PRO SYNC</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        
        #radar-container { width: 100%; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* نافذة المعلومات الوسطى الاحترافية */
        .info-card {
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 420px; background: rgba(15, 15, 15, 0.95);
            border: 1px solid #ffcf00; border-radius: 15px;
            color: white; padding: 20px; z-index: 9999;
            box-shadow: 0 10px 40px rgba(0,0,0,1);
            display: none; /* مخفية في البداية */
            animation: slideUp 0.3s ease-out;
            pointer-events: auto;
        }

        @keyframes slideUp { from { bottom: -100px; opacity: 0; } to { bottom: 35px; opacity: 1; } }

        .route-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .city-code { font-size: 28px; font-weight: 900; color: #ffcf00; }
        .data-row { display: flex; justify-content: space-around; font-family: monospace; font-size: 13px; }
        .close-btn { position: absolute; top: -10px; right: -10px; background: #ffcf00; color: #000; border-radius: 50%; width: 25px; height: 25px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="radar-container">
        <div id="click-detector" style="position:absolute; width:100%; height:100%; z-index:500; pointer-events:none;"></div>

        <div id="flightCard" class="info-card">
            <button class="close-btn" onclick="this.parentElement.style.display='none'">X</button>
            <div class="route-header">
                <div class="city-code">DZA</div>
                <div style="font-size:20px; color:#555;">✈</div>
                <div class="city-code">INTL</div>
            </div>
            <div class="data-row">
                <div>ALT: <span id="alt-val" style="color:#0f0;">---</span> m</div>
                <div>SPD: <span id="spd-val" style="color:#0f0;">---</span> km/h</div>
            </div>
            <div style="text-align:center; font-size:10px; margin-top:10px; color:#888;">RADAR SIGNAL: LOCKED</div>
        </div>

        <iframe 
            id="radar-frame" 
            src="https://globe.adsbexchange.com/?lat=34.0&lon=3.0&zoom=6&mapType=satellite&metric=1&hideSidebar&hideButtons">
        </iframe>
    </div>

    <script>
        // الحل البرمجي: بما أننا لا نستطيع قراءة محتوى الـ iframe، 
        // سنقوم بمراقبة "التركيز" (Focus) على الصفحة. 
        // عندما يضغط المستخدم على أي طائرة، المتصفح سيفقد التركيز على الصفحة الرئيسية وينقله للـ iframe.
        
        let monitor = setInterval(function(){
            let elem = document.activeElement;
            if(elem && elem.tagName == 'IFRAME'){
                // المستخدم نقر داخل الرادار! اظهر النافذة فوراً
                showFlightData();
                window.focus(); // إعادة التركيز لالتقاط النقرة القادمة
            }
        }, 100);

        function showFlightData() {
            const card = document.getElementById('flightCard');
            card.style.display = 'block';
            
            // محاكاة جلب البيانات (بما أن البيانات الحقيقية محبوسة داخل الـ iframe)
            // في تطبيق الـ APK، يمكنك ربط هذا بـ API حقيقي
            document.getElementById('alt-val').innerText = Math.floor(Math.random() * (12000 - 8000) + 8000);
            document.getElementById('spd-val').innerText = Math.floor(Math.random() * (900 - 700) + 700);
        }
    </script>
</body>
</html>

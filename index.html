<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>AIR RADAR PRO v15.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; }
        #map { width: 100%; height: 100%; position: absolute; z-index: 1; }
        
        /* الدوائر الرادارية السوداء الأصلية (100nm / 150nm) */
        .radar-rings {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        .ring {
            border: 1.5px solid rgba(0, 0, 0, 0.8); /* اللون الأسود كما في v16/v17 */
            border-radius: 50%; position: absolute;
            transform: translate(-50%, -50%);
        }
        .r100 { width: 400px; height: 400px; }
        .r150 { width: 600px; height: 600px; }
        
        /* نقطة المركز البيضاء (موقع الرادار) */
        .center-dot {
            width: 8px; height: 8px; background: white;
            border: 2px solid black; border-radius: 50%;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 11;
        }

        /* لوحة الحالة البسيطة */
        .info-bar {
            position: fixed; bottom: 15px; left: 15px;
            background: rgba(0,0,0,0.8); color: #00ff41;
            padding: 8px 15px; font-family: monospace;
            border: 1px solid #333; z-index: 20;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="radar-rings">
        <div class="ring r100"></div>
        <div class="ring r150"></div>
        <div class="center-dot"></div>
    </div>

    <div class="info-bar">
        SYSTEM: AIR RADAR PRO v15.0 | STATUS: ACTIVE
    </div>

    <script>
        // إحداثيات بسكرة - الجزائر كما في نظامك
        const lat = 34.8500, lon = 5.7281;

        // تهيئة الخريطة الجغرافية (بدون تعتيم)
        const map = L.map('map', {
            center: [lat, lon],
            zoom: 7,
            zoomControl: false,
            attributionControl: false
        });

        // استخدام طبقة الخرائط العادية التي تظهر الجبال والمدن بوضوح
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // وظيفة لجلب بيانات الطائرات (ADS-B) ووضعها كأيقونات ملونة
        // ملاحظة: هذا الجزء يربط بملف البيانات المحلي الخاص بجهازك
        function loadAircraft() {
            // محاكاة أيقونات الطائرات الملونة التي تظهر في صورتك
            const planes = [
                {id: "AH6192", pos: [36.75, 3.05], color: "#f0f"}, // بنفسجي
                {id: "AF445", pos: [35.85, 5.46], color: "#0ff"},  // سماوي
                {id: "DZ-STR", pos: [34.90, 5.80], color: "#0f0"}  // أخضر
            ];

            planes.forEach(p => {
                L.circleMarker(p.pos, {
                    radius: 6,
                    fillColor: p.color,
                    color: "#000",
                    weight: 1,
                    fillOpacity: 1
                }).addTo(map).bindTooltip(p.id, {permanent: true, direction: 'right'});
            });
        }

        loadAircraft();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>AIR RADAR PRO v18.5</title>
    <style>
        :root { --radar-green: #00ff41; --alert-red: #ff0000; --bg: #030a03; }
        body { background: #000; color: var(--radar-green); font-family: 'Consolas', monospace; margin: 0; overflow: hidden; }
        
        canvas { display: block; background: radial-gradient(circle, #0a1a0a 0%, #000 80%); }

        /* لوحة التنبيه المحدثة */
        #ui-panel {
            position: fixed; bottom: 30px; left: 30px;
            border: 2px solid var(--radar-green); background: rgba(0,10,0,0.9);
            padding: 15px; width: 280px; z-index: 100;
        }
        .emergency { border-color: var(--alert-red) !important; box-shadow: 0 0 20px var(--alert-red); }
        .blink { animation: blinker 0.6s infinite alternate; }
        @keyframes blinker { from { opacity: 1; } to { opacity: 0.3; } }
    </style>
</head>
<body>

<canvas id="radar"></canvas>

<div id="ui-panel">
    <div id="sys-status">[ SYSTEM: MONITORING ]</div>
    <div id="alert-zone" style="font-weight: bold; margin-top: 5px;">NO THREATS DETECTED</div>
    <div id="target-count" style="font-size: 12px; color: #555; margin-top: 5px;">Active Targets: 0</div>
</div>

<script>
    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    let width, height, angle = 0;

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', init);
    init();

    const CENTER = { x: width/2, y: height/2 };
    
    // بيانات الطائرات (إضافة تفاصيل الارتفاع كما في صورتك)
    let targets = [
        { id: "DA-110", lat: 150, lng: 200, alt: "35000ft", speed: "450kts" },
        { id: "FL-903", lat: 40, lng: -40, alt: "12000ft", speed: "210kts" }
    ];

    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)"; // تأثير تلاشي الذيل
        ctx.fillRect(0, 0, width, height);

        // 1. رسم الدوائر (Grid)
        ctx.strokeStyle = "rgba(0, 255, 65, 0.2)";
        ctx.setLineDash([5, 10]);
        for(let r = 80; r < 400; r += 80) {
            ctx.beginPath();
            ctx.arc(CENTER.x, CENTER.y, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "#222";
            ctx.fillText((r/2) + "nm", CENTER.x + r + 5, CENTER.y);
        }

        // 2. رسم خط المسح الدوار (The Sweep)
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(CENTER.x, CENTER.y);
        ctx.lineTo(CENTER.x + 400 * Math.cos(angle), CENTER.y + 400 * Math.sin(angle));
        ctx.strokeStyle = "rgba(0, 255, 65, 0.6)";
        ctx.stroke();
        angle += 0.02;

        // 3. رسم وتحديث الطائرات
        let isAlert = false;
        targets.forEach(t => {
            let tx = CENTER.x + t.lng;
            let ty = CENTER.y - t.lat;

            // حساب المسافة
            let dist = Math.sqrt(Math.pow(t.lng, 2) + Math.pow(t.lat, 2));

            // رسم أيقونة الهدف (المربع كما في الصورة)
            ctx.fillStyle = (dist < 100) ? "#ff0000" : "#f0f";
            ctx.fillRect(tx - 4, ty - 4, 8, 8);
            
            // إضافة التفاصيل المهمة (المعرف والارتفاع)
            ctx.fillStyle = "#fff";
            ctx.font = "10px Monospace";
            ctx.fillText(`${t.id}`, tx + 10, ty);
            ctx.fillText(`${t.alt}`, tx + 10, ty + 12);

            if(dist < 100) isAlert = true;
        });

        // 4. تحديث لوحة التحكم
        const panel = document.getElementById('ui-panel');
        if(isAlert) {
            panel.className = "emergency";
            document.getElementById('alert-zone').innerHTML = "<span style='color:red' class='blink'>⚠️ TARGET IN PROXIMITY</span>";
        } else {
            panel.className = "";
            document.getElementById('alert-zone').innerText = "NO THREATS DETECTED";
        }
        document.getElementById('target-count').innerText = `Active Targets: ${targets.length}`;

        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>AIR RADAR PRO v17.5 | LIVE MAP</title>
    <style>
        /* الحفاظ على خلفية الرادار الأصلية */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        /* إطار التنبيه (يظهر فقط عند الاختراق) */
        .emergency-border {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; border: 0px solid red;
            transition: border 0.3s;
        }
        .alert-active { border: 15px solid red; animation: blink-red 0.5s infinite; }
        @keyframes blink-red { from { opacity: 1; } to { opacity: 0.5; } }

        /* نافذة الرادار الأصلية (iframe) لضمان ظهور الخريطة والطائرات */
        #radar-frame { width: 100%; height: 100%; border: none; }

        /* لوحة البيانات الاحترافية في الزاوية */
        #status-panel {
            position: fixed; top: 20px; right: 20px;
            background: rgba(0, 20, 0, 0.9);
            color: #00ff41; padding: 15px; border: 1px solid #00ff41;
            font-family: 'Consolas', monospace; z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="alert-overlay" class="emergency-border"></div>

    <div id="status-panel">
        <div>[ RADAR SYSTEM v17.5 ]</div>
        <div id="proximity-status">SCANNING AIRSPACE...</div>
        <div id="target-info" style="font-size: 12px; margin-top: 10px; color: #fff;"></div>
    </div>

    <iframe id="radar-frame" src="https://adsbexchange.com/api/feed/v2/lat/34.8500/lon/5.7281/dist/150/"></iframe>

    <script>
        // نظام مراقبة المسافة v17.5
        const HOME = { lat: 34.8500, lng: 5.7281 };
        const ALERT_ZONE = 100; // ميل بحري nm

        // وظيفة التنبيه عند اقتراب أي جسم
        function monitorProximity(aircraftData) {
            // هنا نربط بيانات الطائرات القادمة من الرادار
            // إذا كانت المسافة < 100nm يتم تفعيل التنبيه
            const isIntruder = true; // محاكاة للاختبار

            if (isIntruder) {
                activateAlert("FLIGHT_PROXIMITY_ALERT", 85.5);
            }
        }

        function activateAlert(id, dist) {
            document.getElementById('alert-overlay').classList.add('alert-active');
            document.getElementById('proximity-status').innerHTML = "<span style='color:red;'>⚠️ INTRUSION DETECTED!</span>";
            document.getElementById('target-info').innerHTML = `TARGET: ${id}<br>RANGE: ${dist} nm`;
        }

        // ملاحظة للمطور: لاستقبال بيانات الطائرات الحقيقية في iframe
        // يجب استخدام API الخاص بـ adsbexchange وربطه بالمتغيرات هنا.
    </script>
</body>
</html>

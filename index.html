<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIR RADAR PRO v7.5 - LIVE</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; color: #0f0; }
        #map { height: 100vh; width: 100%; background: #050505; }
        
        /* واجهة الـ HUD الاحترافية */
        .hud { 
            position: absolute; top: 10px; left: 10px; z-index: 1000; 
            padding: 15px; border: 1px solid #0f0; 
            background: rgba(0, 15, 0, 0.9); 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            pointer-events: none;
        }

        .plane-icon {
            font-size: 24px; color: #0f0;
            text-shadow: 0 0 10px #0f0;
            display: flex; align-items: center; justify-content: center;
            transition: all 1s ease-in-out;
        }

        .status-info { font-size: 12px; margin-top: 5px; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        /* طبقة الرادار الدائرية (جمالية) */
        .radar-sweep {
            position: absolute; top: 50%; left: 50%;
            width: 300px; height: 300px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 500;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div style="font-weight: bold; font-size: 18px; border-bottom: 1px solid #0f0; padding-bottom: 5px;">RADAR OS v7.5</div>
        <div class="status-info">SIGNAL: <span id="sync-status" class="blink" style="color: #ff0;">SCANNING...</span></div>
        <div id="target-info" style="font-size: 11px; color: #888; margin-top: 5px;">ZONE: ALGERIA AIRSPACE</div>
        <div style="font-size: 9px; margin-top: 8px; color: #050;">ENCRYPTION: AES-256 ACTIVE</div>
    </div>

    <div class="radar-sweep"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map, flightLayer;

        window.onload = function() {
            // تركيز الخريطة على الجزائر
            map = L.map('map', { zoomControl: false }).setView([34.0, 3.0], 6);
            
            // قمر صناعي هجين (Hybrid)
            L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                maxZoom: 22, maxNativeZoom: 19
            }).addTo(map);

            flightLayer = L.layerGroup().addTo(map);

            updateRadar();
            setInterval(updateRadar, 30000); // تحديث كل 30 ثانية لتجنب الحظر
        };

        async function updateRadar() {
            const status = document.getElementById('sync-status');
            const targetInfo = document.getElementById('target-info');
            
            // محاولة الاتصال عبر قنوات متعددة (Bypass Strategy)
            const methods = [
                () => fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://opensky-network.org/api/states/all?lamin=18.0&lomin=-9.0&lamax=38.0&lomax=12.0')}`),
                () => fetch('https://opensky-network.org/api/states/all?lamin=18.0&lomin=-9.0&lamax=38.0&lomax=12.0')
            ];

            let success = false;

            for (let getMethod of methods) {
                try {
                    const response = await getMethod();
                    if (!response.ok) continue;
                    
                    const data = await response.json();
                    if (!data.states) continue;

                    flightLayer.clearLayers();
                    data.states.forEach(f => {
                        L.marker([f[6], f[5]], {
                            icon: L.divIcon({
                                className: 'plane-icon',
                                html: `<div style="transform: rotate(${f[10]}deg);">✈</div>`
                            })
                        }).addTo(flightLayer).bindPopup(`<b>FLIGHT:</b> ${f[1]}<br><b>ALT:</b> ${Math.round(f[7])}m<br><b>SPEED:</b> ${Math.round(f[9]*3.6)}km/h`);
                    });

                    status.innerText = "SIGNAL LOCKED";
                    status.style.color = "#0f0";
                    status.classList.remove('blink');
                    targetInfo.innerText = data.states.length + " TARGETS IN SECTOR";
                    success = true;
                    break; 

                } catch (e) {
                    console.log("Channel failed, trying next...");
                }
            }

            if (!success) {
                status.innerText = "SIGNAL LOST";
                status.style.color = "#f00";
                targetInfo.innerText = "FIREWALL DETECTED - RETRYING...";
            }
        }
    </script>
</body>
</html>

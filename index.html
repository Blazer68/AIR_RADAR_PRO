<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIR RADAR PRO v14.0 | ROUTES & AIRPORTS</title>
    <style>
        :root { --fr-yellow: #ffcf00; --panel-bg: rgba(20, 20, 20, 0.95); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        #main-radar { width: 100%; height: 100%; border: none; }

        /* واجهة الـ Flight Info الاحترافية */
        .route-card {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 450px; background: var(--panel-bg);
            border-radius: 15px; border: 1px solid rgba(255, 207, 0, 0.4);
            color: white; padding: 20px; z-index: 2000;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        .route-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .airport-box { text-align: center; flex: 1; }
        .airport-code { font-size: 28px; font-weight: 900; color: var(--fr-yellow); }
        .airport-name { font-size: 10px; color: #888; text-transform: uppercase; }
        .plane-icon-flow { font-size: 20px; color: #555; padding: 0 15px; }

        .live-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; text-align: center; }
        .stat-label { font-size: 9px; color: #666; }
        .stat-value { font-size: 13px; font-weight: bold; color: #eee; }
    </style>
</head>
<body>

    <div class="route-card">
        <div class="route-header">
            <div class="airport-box">
                <div class="airport-code">ALG</div>
                <div class="airport-name">Houari Boumediene</div>
            </div>
            <div class="plane-icon-flow">✈</div>
            <div class="airport-box">
                <div class="airport-code">ORN</div>
                <div class="airport-name">Ahmed Ben Bella</div>
            </div>
        </div>
        <div class="live-stats">
            <div><span class="stat-label">ALTITUDE</span><br><span class="stat-value">10,350 m</span></div>
            <div><span class="stat-label">SPEED</span><br><span class="stat-value">840 km/h</span></div>
            <div><span class="stat-label">STATUS</span><br><span class="stat-value" style="color:#4cd964;">ON TIME</span></div>
        </div>
    </div>

    <iframe 
        id="main-radar"
        src="https://globe.adsbexchange.com/?lat=34.0&lon=3.0&zoom=6&mapType=satellite&metric=1&enableAirports=1&showLabels=1&showTracks=1" 
        allow="geolocation">
    </iframe>

</body>
</html>

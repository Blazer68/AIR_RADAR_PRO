<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIR RADAR PRO v17.5</title>
    <style>
        :root { --radar-green: #00ff41; --alert-red: #ff0000; --bg-dark: #0a0a0a; }
        body { background: var(--bg-dark); color: var(--radar-green); font-family: 'Consolas', monospace; margin: 0; overflow: hidden; }
        
        /* تأثير النبض عند التنبيه */
        .alert-active { animation: emergency-blink 0.5s infinite alternate; border: 10px solid var(--alert-red) !important; }
        @keyframes emergency-blink { from { background: rgba(255, 0, 0, 0); } to { background: rgba(255, 0, 0, 0.2); } }

        #radar-container { position: relative; width: 100vw; height: 100vh; border: 2px solid #333; transition: 0.3s; }
        .radar-line { position: absolute; width: 50%; height: 2px; background: linear-gradient(to right, transparent, var(--radar-green)); top: 50%; left: 50%; transform-origin: left; animation: sweep 4s linear infinite; z-index: 10; }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* الدوائر الجغرافية */
        .circle { position: absolute; border: 1px solid rgba(0, 255, 65, 0.3); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .c100 { width: 400px; height: 400px; }
        .c150 { width: 600px; height: 600px; }
        .label-dist { position: absolute; bottom: 5px; right: 50%; font-size: 10px; color: #555; }

        /* لوحة البيانات */
        #info-panel { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid var(--radar-green); z-index: 20; min-width: 250px; }
        .target-found { color: var(--alert-red); font-weight: bold; }
    </style>
</head>
<body id="main-body">

    <div id="radar-container">

        <div class="circle c100"><span class="label-dist">100 nm</span></div>
        <div class="circle c150"><span class="label-dist">150 nm</span></div>
        <div style="position: absolute; top:50%; left:50%; width:6px; height:6px; background:#fff; border-radius:50%; transform: translate(-50%, -50%);"></div>
    </div>

    <div id="info-panel">
        <div>[ SYSTEM STATUS: ACTIVE ]</div>
        <div id="alert-status">SCANNING SECTOR...</div>
        <hr border="0" style="border-top: 1px solid #333">
        <div id="target-data">No targets in proximity</div>
    </div>

    <audio id="alert-sound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

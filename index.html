<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADAR BYPASS v9.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; }
        #map { height: 100vh; width: 100%; filter: grayscale(1) invert(1) opacity(0.8); }
        .hud { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,20,0,0.9); padding: 15px; border: 1px solid #0f0; }
        .blink { animation: b 1.5s infinite; } @keyframes b { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="hud">
        <div style="font-weight:bold">ULTIMATE BYPASS v9.0</div>
        <div id="status" class="blink" style="color:#ff0">BYPASSING FIREWALL...</div>
        <div id="count">SCANNING SECTOR...</div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([34.0, 3.0], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var layer = L.layerGroup().addTo(map);

        async function scan() {
            try {
                // استخدام وسيط مخصص لتجاوز حماية الـ Firewall
                const r = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://opensky-network.org/api/states/all?lamin=18.0&lomin=-9.0&lamax=38.0&lomax=12.0'));
                const j = await r.json();
                const d = JSON.parse(j.contents);
                
                layer.clearLayers();
                if(d.states) {
                    d.states.forEach(f => {
                        L.marker([f[6], f[5]], {
                            icon: L.divIcon({html: `<div style="transform:rotate(${f[10]}deg);color:#0f0;font-size:20px">✈</div>`})
                        }).addTo(layer);
                    });
                    document.getElementById('status').innerText = "CONNECTION SECURE";
                    document.getElementById('status').style.color = "#0f0";
                    document.getElementById('count').innerText = d.states.length + " AIRCRAFT TRACKED";
                }
            } catch (e) {
                document.getElementById('status').innerText = "FIREWALL ERROR";
            }
        }
        scan(); setInterval(scan, 20000);
    </script>
</body>
</html>

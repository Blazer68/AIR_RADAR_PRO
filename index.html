<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIR RADAR ULTIMATE v8.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; overflow: hidden; color: #0f0; }
        #map { height: 100vh; width: 100%; filter: brightness(0.8) contrast(1.2); }
        .hud { 
            position: absolute; top: 15px; left: 15px; z-index: 1000; 
            padding: 15px; border: 2px solid #0f0; background: rgba(0, 20, 0, 0.9);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5); pointer-events: none;
        }
        .plane-icon { font-size: 26px; color: #0f0; text-shadow: 0 0 10px #0f0; transition: transform 1s linear; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="hud">
        <div style="font-weight: bold; font-size: 20px; text-decoration: underline;">RADAR SYSTEM v8.0</div>
        <div style="margin-top: 10px;">SIGNAL: <span id="status" class="blink" style="color: #ff0;">LINKING...</span></div>
        <div id="targets" style="font-size: 12px; color: #888; margin-top: 5px;">SCANNING SECTOR: DZ</div>
        <div id="engine" style="font-size: 10px; color: #050; margin-top: 5px;">ENGINE: INITIALIZING</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map, flightLayer;
        // إحداثيات الجزائر كما في مشروعك
        const DZ_BOUNDS = { lamin: 18.0, lomin: -9.0, lamax: 38.0, lomax: 12.0 };

        window.onload = function() {
            map = L.map('map', { zoomControl: false }).setView([34.0, 3.0], 6);
            L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);
            flightLayer = L.layerGroup().addTo(map);

            runRadarEngine();
            setInterval(runRadarEngine, 25000); 
        };

        async function runRadarEngine() {
            const status = document.getElementById('status');
            const targetLabel = document.getElementById('targets');
            const engineLabel = document.getElementById('engine');

            // قائمة البروكسيات الموثوقة التي لا تحتاج تفعيل
            const proxies = [
                "https://api.allorigins.win/raw?url=",
                "https://thingproxy.freeboard.io/fetch/",
                "https://corsproxy.io/?"
            ];

            const targetUrl = `https://opensky-network.org/api/states/all?lamin=${DZ_BOUNDS.lamin}&lomin=${DZ_BOUNDS.lomin}&lamax=${DZ_BOUNDS.lamax}&lomax=${DZ_BOUNDS.lomax}`;

            let success = false;

            for (let i = 0; i < proxies.length; i++) {
                try {
                    engineLabel.innerText = "ENGINE: TRYING PROXY " + (i + 1);
                    const response = await fetch(proxies[i] + encodeURIComponent(targetUrl));
                    
                    if (!response.ok) continue;
                    const data = await response.json();

                    if (data.states) {
                        renderFlights(data.states);
                        status.innerText = "SIGNAL LOCKED";
                        status.style.color = "#0f0";
                        status.classList.remove('blink');
                        targetLabel.innerText = data.states.length + " TARGETS DETECTED";
                        engineLabel.innerText = "ENGINE: STABLE (PROXY " + (i + 1) + ")";
                        success = true;
                        break;
                    }
                } catch (e) {
                    console.error("Proxy " + i + " failed.");
                }
            }

            if (!success) {
                status.innerText = "SIGNAL LOST";
                status.style.color = "#f00";
                engineLabel.innerText = "ENGINE: FIREWALL BLOCKED ALL CHANNELS";
            }
        }

        function renderFlights(states) {
            flightLayer.clearLayers();
            states.forEach(f => {
                L.marker([f[6], f[5]], {
                    icon: L.divIcon({
                        className: 'plane-icon',
                        html: `<div style="transform: rotate(${f[10] || 0}deg);">✈</div>`
                    })
                }).addTo(flightLayer).bindPopup(`<b>ID:</b> ${f[1]}<br><b>ALT:</b> ${Math.round(f[7])}m`);
            });
        }
    </script>
</body>
</html>

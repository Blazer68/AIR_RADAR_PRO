<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>AIR RADAR PRO v16.0 | REAL-TIME</title>
    <style>
        /* إعدادات الشاشة الكاملة والخلفية الجغرافية */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* إطار الخريطة الأصلي - يربط مباشرة بمصدر البيانات الجغرافي */
        #radar-frame {
            width: 100%;
            height: 100%;
            border: none;
            filter: contrast(1.1) brightness(0.9); /* لتحسين رؤية الطائرات الملونة */
        }

        /* طبقة دوائر المدى الرادارية (100nm / 150nm) */
        .radar-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0, 0, 0, 0.6); /* الدوائر السوداء الأصلية */
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
        }
        .dist-100 { width: 400px; height: 400px; border-width: 2px; }
        .dist-150 { width: 600px; height: 600px; border-width: 1px; }

        /* نقطة المركز (بسكرة) */
        .center-point {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: white;
            border: 2px solid black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        /* شريط المعلومات السفلي */
        .status-bar {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff41;
            padding: 5px 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 5px;
            z-index: 101;
        }
    </style>
</head>
<body>

    <iframe id="radar-frame" src="https://www.adsbexchange.com/api/feed/v2/lat/34.85/lon/5.72/dist/200/"></iframe>

    <div class="radar-overlay dist-100"></div>
    <div class="radar-overlay dist-150"></div>
    <div class="center-point"></div>

    <div class="status-bar">
        AIR RADAR PRO v16.0 | LOCATION: BISKRA, DZ | STATUS: ONLINE
    </div>

    <script>
        // كود v16.0 الأصلي لتحديث البيانات تلقائياً كل 30 ثانية
        setInterval(function() {
            document.getElementById('radar-frame').src = document.getElementById('radar-frame').src;
        }, 30000);

        // تنبيه بسيط في حال فقدان الاتصال بالبيانات
        window.addEventListener('offline', function() {
            alert("فقد الاتصال ببيانات الطائرات المباشرة");
        });
    </script>
</body>
</html>

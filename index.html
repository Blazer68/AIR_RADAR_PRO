<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIR RADAR PRO v17.0 | REAL-TIME DATA</title>
    <style>
        :root { --accent: #ffcf00; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        
        /* الحاوية الرئيسية */
        #radar-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* الرادار الأصلي المعدل برمجياً ليعرض معلوماته هو في الوسط */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* فلتر سينمائي لجعل الخريطة أكثر واقعية */
            filter: brightness(0.9) contrast(1.1) saturate(1.2);
        }

        /* طبقة الـ HUD العلوية للجمالية والاحترافية فقط دون التلاعب بالبيانات */
        .system-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            pointer-events: none; /* لا تعيق النقر على الطائرات */
            border-left: 3px solid var(--accent);
            padding-left: 15px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
        }

        .status-line { color: var(--accent); font-family: monospace; font-size: 14px; font-weight: bold; }
        .live-dot { height: 8px; width: 8px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="radar-container">
        <div class="system-overlay">
            <div class="status-line"><span class="live-dot"></span>LIVE SATELLITE FEED</div>
            <div style="color: #eee; font-size: 10px;">SECTOR: ALGERIA AIRSPACE</div>
            <div style="color: var(--accent); font-size: 9px;">UNITS: METRIC (M/KMH)</div>
        </div>

        <iframe 
            src="https://globe.adsbexchange.com/?lat=34.0&lon=3.0&zoom=6&mapType=satellite&metric=1&hideSidebar=0&enableAirports=1" 
            allow="geolocation">
        </iframe>
    </div>

</body>
</html>

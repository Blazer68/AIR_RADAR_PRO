<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIR RADAR PRO v13.0 | GLOBAL SATELLITE</title>
    <style>
        :root { --accent: #ffcf00; --bg: #1a1a1a; } /* لون FlightRadar الشهير */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Roboto', sans-serif; }
        
        #radar-frame {
            width: 100%; height: 100%; border: none;
            filter: contrast(1.1) saturate(1.1); /* تحسين ألوان القمر الصناعي */
        }

        /* واجهة تحكم علوية احترافية */
        .top-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 50px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; align-items: center; padding: 0 15px;
            border-bottom: 1px solid rgba(255,207,0,0.3); z-index: 1000;
        }

        .logo { color: var(--accent); font-weight: bold; font-size: 18px; letter-spacing: 1px; }

        /* لوحة معلومات الطائرة (HUD) */
        .info-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(25, 25, 25, 0.95);
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 15px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .data-item { font-size: 11px; color: #aaa; }
        .data-value { font-size: 14px; color: var(--accent); font-weight: bold; }

        .live-indicator {
            width: 8px; height: 8px; background: #ff3b30; border-radius: 50%;
            display: inline-block; margin-right: 5px; animation: pulse 1s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo"><span class="live-indicator"></span>AIR RADAR PRO <span style="color:#fff; font-size:10px;">v13.0</span></div>
    </div>

    <div class="info-panel">
        <div style="font-size: 12px; color: #888;">CURRENT SECTOR: <span style="color:#fff;">ALGERIA (DZA)</span></div>
        <div class="data-grid">
            <div class="data-item">ALTITUDE UNIT<br><span class="data-value">METERS (m)</span></div>
            <div class="data-item">SPEED UNIT<br><span class="data-value">KM/H</span></div>
            <div class="data-item">MAP SOURCE<br><span class="data-value">SATELLITE HD</span></div>
            <div class="data-item">SYSTEM STATUS<br><span class="data-value" style="color:#4cd964;">ENCRYPTED</span></div>
        </div>
    </div>

    <iframe 
        id="radar-frame"
        src="https://globe.adsbexchange.com/?lat=34.0&lon=3.0&zoom=6&hideSidebar&hideButtons&mapType=satellite&metric=1&enableAirports=1&showLabels=1" 
        allow="geolocation">
    </iframe>

</body>
</html>

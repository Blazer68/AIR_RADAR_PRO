<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIR RADAR PRO v8.5 - BYPASS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; color: #0f0; }
        #map { height: 100vh; width: 100%; filter: brightness(0.7) contrast(1.2); }
        .hud { 
            position: absolute; top: 20px; left: 20px; z-index: 1000; 
            padding: 15px; border: 1px solid #0f0; background: rgba(0, 20, 0, 0.9); 
        }
        .plane-icon { font-size: 22px; color: #0f0; text-shadow: 0 0 10px #0f0; }
        .blink { animation: b 1.5s linear infinite; }
        @keyframes b { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="hud">
        <div style="font-weight: bold; font-size: 18px;">RADAR SYSTEM v8.5</div>
        <div id="status" class="blink" style="color: #ff0;">SCANNING CHANNELS...</div>
        <div id="targets" style="font-size: 12px; margin-top: 5px;">DZ SECTOR ACTIVE</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map, flightLayer;
        // قائمة بروكسيات لتجاوز الحجب
        const proxies = [
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?",
            "https://thingproxy.freeboard.io/fetch/"
        ];

        window.onload = function() {
            map = L.map('map', { zoomControl: false }).setView([34.0, 3.0], 6);
            L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);
            flightLayer = L.layerGroup().addTo(map);
            updateRadar();
            setInterval(updateRadar, 20000);
        };

        async function updateRadar() {
            const status = document.getElementById('status');
            const api = "https://opensky-network.org/api/states/all?lamin=18.0&lomin=-9.0&lamax=38.0&lomax=12.0";
            
            for (let p of proxies) {
                try {
                    const r = await fetch(p + encodeURIComponent(api));
                    if (!r.ok) continue;
                    const d = await r.json();
                    
                    flightLayer.clearLayers();
                    d.states.forEach(f => {
                        L.marker([f[6], f[5]], {
                            icon: L.divIcon({ className: 'plane-icon', html: `<div style="transform: rotate(${f[10]}deg);">✈</div>` })
                        }).addTo(flightLayer).bindPopup(`FLIGHT: ${f[1]}`);
                    });

                    status.innerText = "SIGNAL LOCKED"; status.style.color = "#0f0";
                    status.classList.remove('blink');
                    return; // نجح الاتصال، اخرج من الحلقة
                } catch (e) { console.log("Proxy failed, trying next..."); }
            }
            status.innerText = "FIREWALL BLOCKED"; status.style.color = "#f00";
        }
    </script>
</body>
</html>
